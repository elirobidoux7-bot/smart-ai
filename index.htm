<!DOCTYPE html>
<html lang="en">
<head>
  <title>Smart AI – Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>📊 Smart AI Dashboard</h1>

  <!-- STOCK GRID -->
  <div id="stocks" class="grid"></div>

  <hr>

  <h3>Your Stock</h3>

  <!-- STOCK SELECT -->
  <select id="symbol">
    <option value="">Select a stock</option>
  </select>

  <br><br>

  <!-- SHARES INPUT -->
  <input id="shares" type="number" placeholder="Shares Owned">

  <button onclick="analyze()">Analyze</button>

  <hr>

  <h3>Search Any Stock</h3>

  <input id="search" placeholder="Enter ticker (ex: AAPL)">
  <button onclick="searchStock()">Search</button>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
