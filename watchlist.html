<!DOCTYPE html>
<html lang="en">
<head>
  <title>Watchlist – Smart AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAV BAR -->
  <div id="nav"></div>

  <h2>⭐ Watchlist</h2>

  <!-- WATCHLIST GRID -->
  <div id="watchlist" class="grid"></div>

  <!-- LOAD NAV -->
  <script>
    fetch("nav.html")
      .then(r => r.text())
      .then(d => {
        document.getElementById("nav").innerHTML = d;
      });
  </script>

  <!-- WATCHLIST LOGIC -->
  <script src="watchlist.js"></script>

  <!-- INIT -->
  <script>
    loadWatchlist();
  </script>

</body>
</html>
